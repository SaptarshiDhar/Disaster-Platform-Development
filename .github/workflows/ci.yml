name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: apps/web — typecheck, lint, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Version comes from `packageManager` in the root package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @workspace/web...

      - name: Typecheck
        run: pnpm --filter @workspace/web run typecheck

      - name: Lint
        run: pnpm --filter @workspace/web run lint

      # No secrets are provided. Phase 0 must build without any integration
      # credentials — if this step starts needing them, that is a bug.
      - name: Build
        run: pnpm --filter @workspace/web run build
